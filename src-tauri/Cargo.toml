[package]
name = "cutvideo"
version = "0.1.1"
license = "MIT"
authors = ["Alberth Artigas"]
description = "CutVideo — editor de vídeo rápido"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "cutvideo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` habilita asset:// para que el WebView reproduzca archivos locales
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
reqwest = { version = "0.13.5", default-features = false, features = ["multipart", "json", "http2", "charset", "rustls"] }
rustfft = "6.4.1"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
minisign-verify = "0.2.5"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
