# Compila las versiones de Windows y las añade a una release que ya exista.
#
# El .app de macOS se compila en el Mac del autor (ahí está el Developer ID);
# Windows lo hace GitHub, porque desde macOS no se puede cross-compilar: hacen
# falta el toolchain de MSVC, WebView2 y el instalador.
#
# Arquitecturas: x64 y ARM64. **No hay versión de 32 bits** y no es un olvido:
# FFmpeg no publica builds LGPL para win32 desde hace años, y sin el sidecar la
# app no puede cortar ni exportar nada. Windows 11 tampoco existe en 32 bits.
name: Windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la release (por ejemplo v0.1.1)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            ffmpeg: win64
          - target: aarch64-pc-windows-msvc
            ffmpeg: winarm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # FFmpeg va como sidecar, no enlazado. Se coge la build LGPL para no
      # arrastrar la GPL a una app con licencia MIT.
      - name: Preparar los sidecars de FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-${{ matrix.ffmpeg }}-lgpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item $bin.FullName "src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe"
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") "src-tauri/binaries/ffprobe-${{ matrix.target }}.exe"

      # Aquí no se usa `npm ci`, y no es por pereza: el package-lock.json se
      # genera en el Mac del autor y npm no sabe rehacer las dependencias
      # nativas opcionales para otra plataforma (npm/cli#4828). Con el lock
      # puesto, `npm ci` acaba en un escueto "Invalid Version:" o instala unos
      # binarios de rolldown y tailwind que no arrancan en Windows. Borrando el
      # lock, npm resuelve los correctos. Se pierde el pinning exacto de
      # versiones a cambio de que la compilación funcione.
      - name: Instalar dependencias
        shell: pwsh
        run: |
          Remove-Item package-lock.json -ErrorAction SilentlyContinue
          npm install --no-audit --no-fund

      - name: Compilar y subir a la release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sin esta clave el paquete sale sin firmar y el actualizador lo rechaza.
          # Se guarda con:
          #   gh secret set TAURI_SIGNING_PRIVATE_KEY --repo alberthartigas/cutvideo < ~/.tauri/cutvideo.key
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ env.TAG }}
          releaseId: ${{ github.event.release.id }}
          args: --target ${{ matrix.target }}

  # Los secretos no se pueden consultar desde el `if` de un job, así que se
  # miran aquí y el resultado se pasa como salida. Mientras no haya cuenta de
  # SignPath esto vale 'false', el job de firma se salta entero y la release
  # sale exactamente igual que antes.
  firma-configurada:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.mirar.outputs.lista }}
    steps:
      - id: mirar
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG" ]; then
            echo "lista=true" >> "$GITHUB_OUTPUT"
          else
            echo "lista=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin credenciales de SignPath: los instaladores salen sin firmar."
          fi

  # Firma Authenticode de los instaladores, que es lo que quita el aviso de
  # «editor desconocido» de SmartScreen y calma a los antivirus.
  #
  # Va después de compilar y no como `signCommand` de Tauri porque SignPath
  # firma en su servidor: se sube el artefacto, se espera y se descarga
  # firmado. Eso no encaja en un comando síncrono del empaquetado.
  #
  # Lo delicado lo hace scripts/refirmar-windows.sh: al firmar cambian los
  # bytes del instalador y la firma del actualizador deja de valer, así que
  # hay que rehacerla antes de que `merge` junte el latest.json.
  firmar:
    needs: [build, firma-configurada]
    if: needs.firma-configurada.outputs.lista == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bajar los instaladores de la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sin-firmar
          gh release download "$TAG" --dir sin-firmar --clobber \
            --pattern "*-setup.exe" --pattern "*_en-US.msi"
          ls -l sin-firmar

      - id: subir
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-sin-firmar
          path: sin-firmar/

      # project-slug y signing-policy-slug tienen que coincidir con los del
      # proyecto creado en SignPath; si allí se llaman de otra forma, se cambian
      # aquí. Ver docs/windows-firma.md.
      - name: Firmar en SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          project-slug: cutvideo
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.subir.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmados

      - name: Rehacer la firma del actualizador y subir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: bash scripts/refirmar-windows.sh "$TAG" firmados

  # Cada compilación sube su propio latest.json y la última borraría a las
  # demás, así que se juntan al final, cuando ya han terminado todas.
  merge:
    needs: [build, firmar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Juntar el latest.json de todas las plataformas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/merge-latest-json.sh "${{ env.TAG }}"

      # Ya con las dos plataformas dentro, la release deja de ser prelanzamiento
      # y pasa a ser la que ofrece el actualizador. Si Windows ha fallado se
      # queda como está: mejor no actualizar a nadie que dar un manifiesto a medias.
      # Con la firma igual: si falla, el instalador de la release y la firma del
      # latest.json podrían no corresponderse, y el actualizador rechazaría la
      # descarga. Mejor dejarla en prelanzamiento y mirarlo.
      - name: Ascender la release a "latest"
        if: needs.build.result == 'success' && needs.firmar.result != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ env.TAG }}" --prerelease=false --latest
